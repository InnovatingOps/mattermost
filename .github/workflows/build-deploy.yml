name: Build

# Every push to `production` runs the webapp test suite, then builds the
# Team Edition linux tarball (same recipe as upstream Server CI) and publishes
# it as a GitHub release, tagged `build-<UTC-date>-<short-sha>`. The same
# tarball is kept for 7 days as the `dist` artifact for debugging. The build is
# gated on tests passing.
#
# Deployment is deliberately manual: the repo is public, so the host can fetch
# the release asset directly and install it (deploy/deploy.sh still runs there,
# pinned by deploy/server-setup.sh). The automated SSH deploy job was removed.

on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: build-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.go.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: go
        run: echo "version=$(cat server/.go-version)" >> "$GITHUB_OUTPUT"

  test:
    name: Run webapp tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - name: ci/setup
        uses: ./.github/actions/webapp-setup
      - name: ci/test
        env:
          NODE_OPTIONS: --max_old_space_size=5120
        run: npm run test

  build:
    name: Build dist tarball
    needs: [go-version, test]
    runs-on: ubuntu-22.04
    container: mattermost/mattermost-build-server:${{ needs.go-version.outputs.version }}
    defaults:
      run:
        working-directory: server
    env:
      BUILD_NUMBER: ${{ github.run_id }}
    outputs:
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release name
        id: meta
        shell: bash
        run: echo "release=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "webapp/package-lock.json"
      - name: Run setup-go-work
        run: make setup-go-work
      - name: Build
        run: |
          make config-reset
          make build-cmd
          make package-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: server/dist/*-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The tag is prefixed `build-` on purpose: `v*` belongs to upstream, whose
      # release tags land here through the sync workflow's merges.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ needs.build.outputs.release }}
        run: |
          gh release create "$TAG" dist/*-linux-amd64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
